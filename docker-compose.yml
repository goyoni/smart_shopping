services:
  browser:
    build: docker/browser
    ports:
      - "3001:3000"
    restart: unless-stopped
    shm_size: "2gb"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
