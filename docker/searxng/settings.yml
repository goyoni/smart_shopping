use_default_settings: true

general:
  instance_name: "smart-shopping-search"

search:
  safe_search: 0
  default_lang: "all"
  formats:
    - html
    - json

server:
  secret_key: "smart-shopping-agent-searxng-key"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

engines:
  # Enable major search engines
  - name: google
    engine: google
    disabled: false
    shortcut: g

  - name: bing
    engine: bing
    disabled: false
    shortcut: b

  - name: duckduckgo
    engine: duckduckgo
    disabled: false
    shortcut: ddg

  - name: brave
    engine: brave
    disabled: false
    shortcut: br

  # Disable engines that aren't useful for product search
  - name: wikipedia
    engine: wikipedia
    disabled: true

  - name: wikidata
    engine: wikidata
    disabled: true
